# THE SUITES, ON SOMEONE ELSE'S MACHINE.
#
# This is the point of the file. The strokes and the smoke checks existed
# for weeks and only one person could run them -- which, for a harness whose
# whole claim is "every guard is named after the failure that earned it",
# meant a stranger had to take the guards on faith.
#
# NO RACK, NO NETWORK, NO GPU, NO MODEL. Every model call in both suites is
# a stub; nothing here ever reaches 127.0.0.1:11434. If a change makes these
# suites need a live model, THAT IS THE REGRESSION -- the offline property is
# the thing being protected, not an incidental convenience.
#
# WHAT IS INSTALLED, AND WHY, because a stranger reads this to know what the
# promise covers:
#   ollama  manjuel/runtime.py imports it at module load. Never called.
#   numpy   `.[test]`, added 2026-09-10. test_listening_follows_the_speaker
#           imports it outright to drive voice.py's silence detector with
#           real frames. numpy is optional to RUN manjuel (vectors.py wraps
#           it in try/except) and NOT optional to prove the listening turn.
#           Without it this workflow was red on every leg from 164ea2c
#           onward -- 30 runs, no green. It is a library, not a model: the
#           offline promise is untouched.
#
# law.py --prove is hermetic (9 strokes, temp dirs, exit 0) and runs beside
# them. `verify` is NOT run here: it walks the committed chain, and a fork
# with a re-terminated law file should fail on the operator's terminal, not
# in a CI job that cannot tell tampering from a checkout artifact.

name: prove

# A LINE IS PROVED ONCE (2026-10-09, WHAT'S LEFT I1's sixth step): by its pull
# request, and main and the marks by their own push. A bare `push:` ran this on
# every line AND on its pull request -- the same commit twice, eight legs for
# four. Main takes a change only through a pull request whose four legs are
# green, so that run is the one that counts; a mark is still proved as GitHub
# checks it out, shallow and detached (his notes, tag testing, "AS GITHUB CHECKS OUT"); and
# `workflow_dispatch` still proves any line by hand. tests/release.py's
# `workflows` check refuses a workflow that runs on pull requests and on a push
# to every line.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ONE RUN PER REF. Without this every push starts a four-leg matrix and the
# superseded one keeps going: five pushes in half an hour on 2026-09-10 meant
# twenty jobs, most of them proving commits that had already been replaced.
# A newer push on the same ref supersedes the older run, so the older one is
# cancelled rather than finished for nobody.
concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prove:
    # THE CHECK NAMES ARE THE RULESET'S, AND THEY DO NOT MOVE. main's ruleset
    # requires "prove (windows-latest, 3.10)" and its three siblings by name.
    # `os` and `python` stay the matrix's keys and say which leg this is; the
    # machine and the interpreter each leg actually gets are pinned in
    # `include` below. The name is written out so a key added there can never
    # change it.
    name: prove (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # The ground is Windows and the record is CRLF (.gitattributes).
        # Ubuntu is in the matrix precisely BECAUSE of that: the suites must
        # not quietly depend on the operator's platform, and the terminator
        # rules are declared in-repo rather than per-machine.
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
        # EVERY PIECE PINNED (2026-11-04, his word: "all pieces of the estate
        # need to be pinned and versioned for CI"). `image` is what the
        # `-latest` label resolved to on run 41871959699 that day:
        # windows-latest -> windows-2025-vs2026, ubuntu-latest -> ubuntu-26.04
        # (GitHub was moving ubuntu-latest from 24.04 to 26.04). `exact` is the
        # patch setup-python gave each leg: 3.13.17 on both systems; 3.10.11 on
        # Windows, the last 3.10 with a Windows build, and 3.10.22 on Ubuntu.
        # `lock` is the hashed set that Python installs. Moved by hand, on his
        # word, never by a bot.
        include:
          - { os: windows-latest, python: "3.10", image: windows-2025-vs2026, exact: "3.10.11", lock: requirements-py310.lock }
          - { os: windows-latest, python: "3.13", image: windows-2025-vs2026, exact: "3.13.17", lock: requirements-py313.lock }
          - { os: ubuntu-latest, python: "3.10", image: ubuntu-26.04, exact: "3.10.22", lock: requirements-py310.lock }
          - { os: ubuntu-latest, python: "3.13", image: ubuntu-26.04, exact: "3.13.17", lock: requirements-py313.lock }
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10

    steps:
      # DEFENDER STANDS ASIDE ON THE WINDOWS LEGS (2026-11-04). GitHub's run
      # 41747691064 took ~305 s over the strokes on windows-latest and 55-74 s
      # on ubuntu-latest -- the same code, five times slower. The suite spawns
      # git and python in temp dirs and writes thousands of small files, and
      # real-time scanning opens every one of them; that is the classic Windows
      # runner tax. A hosted runner is a throwaway machine and runs as admin, so
      # the workspace and both temp roots are excluded before anything is
      # checked out or written. It changes how fast the legs run, not what they
      # prove: the steps below are the same steps on both systems.
      - name: Exclude the workspace and temp from Defender (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE","$env:RUNNER_TEMP","$env:TEMP"

      # EVERY ACTION BY ITS COMMIT, the tag beside it (2026-11-04): a tag is
      # moved by its owner, a commit is not. tests/release.py's `workflows`
      # check refuses any other form, GitHub's own `actions/` included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v4)

      # THE PIP CACHE (2026-11-04). setup-python and the install cost 23-46 s
      # a leg on Windows, downloading the same wheels every run. The cache is
      # keyed on the leg's lock, the one file that says what is installed, so
      # a change to the dependencies is a new key and never a stale wheel.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (v5)
        with:
          python-version: ${{ matrix.exact }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}

      # THE LOCKED INSTALL (2026-11-04). pip at an exact version; then the
      # leg's lock, every file checked against its hash (pip-compile
      # --generate-hashes from pyproject.toml with the `test` extra, setuptools
      # included); then manjuel itself with nothing fetched -- no dependency,
      # and no isolated build that would pull a setuptools of its own. The
      # extra is named so the strokes' check reads the extra this install is
      # for; its packages come from the lock. `pip check` is the wire: a
      # dependency pyproject.toml gains and the lock does not carry goes red
      # here. Regenerate the locks with the command in each one's header.
      - name: Install (pip, the locked set by hash, then manjuel with nothing fetched)
        run: >-
          python -m pip install pip==26.3 &&
          python -m pip install --require-hashes -r ${{ matrix.lock }} &&
          python -m pip install --no-deps --no-build-isolation ".[test]" &&
          python -m pip check

      - name: The strokes
        run: python tests/test_manjuel.py

      - name: The smoke suite
        # RUN THE SMOKE SUITE, NOT JUST THE STROKES. It was RED at 34/50
        # from 14e2711 to 2026-09-02 because its StubRuntime had not been
        # moved with pipeline.py, and the strokes were green the whole
        # time. That is the exact failure this step exists to prevent.
        run: python tests/smoke_cli.py

      - name: The law proves itself
        run: python law/law.py --prove

      - name: The build map matches the code
        # BUILDMAP.md is generated from the code with ast (tests/buildmap.py).
        # A stale map is a map that lies about where things are.
        run: python tests/buildmap.py --check

      - name: The refusals document lists every site in the code
        # REFUSALS.md's tail is generated from the code (tests/refusals.py):
        # every `Refused:` site by module and line. A stale tail is a document
        # that says the code refuses where it does not, or not where it does.
        run: python tests/refusals.py --check

      - name: The standup harness runs (dry, stub models)
        # The live standup is the operator's terminal; this proves the
        # harness itself and the two arithmetic gates it exercises.
        run: python tests/standup.py --dry

      - name: The record, audited
        # Reports, never gates (audit_record.py's own rule: the corpus is
        # ambient and an assertion over it goes red because someone ran the
        # CLI). Kept visible in the log; its exit code is not the verdict.
        continue-on-error: true
        run: python tests/audit_record.py
